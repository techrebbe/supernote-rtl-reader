name: Apply native size redraw fix

on:
  push:
    branches:
      - v0.4.3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout v0.4.3
        uses: actions/checkout@v4
        with:
          ref: v0.4.3
          fetch-depth: 0

      - name: Apply canonical native lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          native = Path('native/PdfPageView.kt.template')
          text = native.read_text(encoding='utf-8')
          marker = '    override fun onDraw(canvas: Canvas) {\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one onDraw marker, found {text.count(marker)}')
          block = '''    private fun requestBitmapRedraw(reason: String) {
              val bitmap = pageBitmap ?: return
              if (bitmap.isRecycled || width <= 0 || height <= 0) return
              val pageNumber = pageBitmapMetadata?.key?.pageIndex?.plus(1) ?: -1
              Log.i(
                  "RTL_READER",
                  "RTL_READER_NATIVE_VIEW_SIZE_REDRAW page=$pageNumber reason=$reason size=${width}x${height}",
              )
              postInvalidate()
          }

          override fun onAttachedToWindow() {
              super.onAttachedToWindow()
              requestBitmapRedraw("attached")
          }

          override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
              super.onSizeChanged(w, h, oldw, oldh)
              if (w > 0 && h > 0 && (w != oldw || h != oldh)) {
                  requestBitmapRedraw("size_changed")
              }
          }

          override fun onDraw(canvas: Canvas) {
          '''
          native.write_text(text.replace(marker, block, 1), encoding='utf-8')

          installer = Path('scripts/install_native.py')
          text = installer.read_text(encoding='utf-8')
          old = '''        rendered = source.read_text(encoding="utf-8").replace("__PACKAGE__", package_name)
                  (package_dir / output_name).write_text(rendered, encoding="utf-8")
          '''
          new = '''        rendered = source.read_text(encoding="utf-8").replace("__PACKAGE__", package_name)
                  if source_name == "PdfPageView.kt.template":
                      for marker in (
                          "override fun onSizeChanged",
                          "override fun onAttachedToWindow",
                          "RTL_READER_NATIVE_VIEW_SIZE_REDRAW",
                      ):
                          if marker not in rendered:
                              fail(f"canonical PdfPageView missing lifecycle marker: {marker}")
                  (package_dir / output_name).write_text(rendered, encoding="utf-8")
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one installer copy marker, found {text.count(old)}')
          installer.write_text(text.replace(old, new, 1), encoding='utf-8')

          config_path = Path('PluginConfig.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['versionCode'] = '19'
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('overlay/index.js')
          text = index.read_text(encoding='utf-8')
          old_marker = "RTL_READER_OPEN v0.4.3"
          new_marker = "RTL_READER_OPEN v0.4.3-r2"
          if text.count(old_marker) != 1:
              raise SystemExit(f'expected one runtime marker, found {text.count(old_marker)}')
          index.write_text(text.replace(old_marker, new_marker, 1), encoding='utf-8')

          Path('.github/workflows/apply-native-size-redraw.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Redraw native page when landscape view receives its size"
          git push origin HEAD:v0.4.3
