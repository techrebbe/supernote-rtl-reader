name: Build Supernote RTL Reader

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supernote-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  virtual-spread-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: virtual_spread/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare companion signing key
        id: companion-signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VIRTUAL_SPREAD_APK_KEYSTORE_BASE64 }}
        run: |
          stable_path="$RUNNER_TEMP/virtual-spread-stable.keystore"
          ephemeral_path="$RUNNER_TEMP/virtual-spread-ephemeral.keystore"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$stable_path"
            chmod 600 "$stable_path"
            echo "keystore=$stable_path" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair \
              -keystore "$ephemeral_path" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "keystore=$ephemeral_path" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable APK signing secret is unavailable; the companion APK will be tested but not uploaded."
          fi

      - name: Install pinned virtual-spread dependencies
        run: python -m pip install -r virtual_spread/requirements.txt

      - name: Test virtual-spread generator
        run: python scripts/test_virtual_spread.py

      - name: Check native invariants
        run: |
          python scripts/check_native_invariants.py .
          python scripts/check_native_spread_invariants.py .

      - name: Test virtual-spread companion module
        shell: pwsh
        run: ./virtual-spread-module/test.ps1

      - name: Build and verify virtual-spread companion APK
        shell: pwsh
        env:
          VIRTUAL_SPREAD_KEYSTORE: ${{ steps.companion-signing.outputs.keystore }}
        run: >-
          ./virtual-spread-module/build.ps1
          -DebugKeystore $env:VIRTUAL_SPREAD_KEYSTORE

      - name: Upload virtual-spread companion APK
        if: steps.companion-signing.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supernote-virtual-spread-navigation
          path: virtual-spread-module/build/artifact/*.apk
          if-no-files-found: error
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build plugin
        run: |
          chmod +x build.sh
          set +e
          ./build.sh > build.log 2>&1
          status=$?
          tail -n 100 build.log > build-tail.log
          cat build-tail.log
          exit $status

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-build-failure
          path: build-tail.log
          if-no-files-found: error
          retention-days: 2

      - name: Verify package
        run: |
          test -n "$(find out -maxdepth 1 -name '*.snplg' -print -quit)"
          ls -lh out/*.snplg

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-v0.4.12-native-spread-appearance
          path: out/*.snplg
          if-no-files-found: error
          retention-days: 3
