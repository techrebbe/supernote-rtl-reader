name: Build Supernote RTL Reader

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supernote-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace-helper-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Native Reader trace-helper tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_trace_helper_fail_closed.ps1

  invariant-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Native Reader v2 invariant suites
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.2
          python3 scripts/test_native_reader_v2_core.py .
          python3 scripts/test_native_reader_v2_mutations.py .
          python3 scripts/check_native_reader_v2_invariants.py .
          python3 scripts/check_native_invariants.py .
          python3 scripts/check_native_spread_invariants.py .
          python3 scripts/test_build_provenance.py .
          python3 scripts/test_plugin_packaging_fail_closed.py

  native-spread-build:
    name: Native Reader v2 unsigned assembly
    needs:
      - invariant-suites
      - trace-helper-tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Compile deterministic aligned Native Reader v2 package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = if ($env:ANDROID_SDK_ROOT) {
            $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
            $env:ANDROID_HOME
          } else {
            throw 'Android SDK setup did not publish an SDK root.'
          }
          $windowsPowerShell = Join-Path `
            $env:SystemRoot `
            'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\native-spread-module\build.ps1 `
            -AndroidSdk $sdk `
            -AlignedOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Native Reader v2 build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare aligned APK and machine-readable provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inputApk = Join-Path $env:GITHUB_WORKSPACE `
            'native-spread-module\build\spread-probe-aligned.apk'
          if (-not (Test-Path -LiteralPath $inputApk -PathType Leaf)) {
            throw 'The deterministic aligned APK is missing.'
          }
          $releaseInput = Join-Path $env:GITHUB_WORKSPACE `
            'native-spread-module\build\release-input'
          New-Item -ItemType Directory -Force -Path $releaseInput | Out-Null
          $artifactName = 'SupernoteNativeReaderV2-v0.0.140-aligned.apk'
          $artifactPath = Join-Path $releaseInput $artifactName
          Copy-Item -LiteralPath $inputApk -Destination $artifactPath
          $artifactSha256 = (Get-FileHash `
            -LiteralPath $artifactPath `
            -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            schemaVersion = 1
            authority = 'supernote-native-reader-v2-release-input-v1'
            sourceCommit = '${{ github.sha }}'
            artifactFile = $artifactName
            artifactSha256 = $artifactSha256
            packageName = 'com.techrebbe.supernote.spreadprobe'
            versionCode = 140
            versionName = '0.0.140'
            expectedSignerSha256 = 'a5a8551131de84d41660a3cf22d224f320f7a2f05a380282f76f6fe731807c67'
          }
          $json = $provenance | ConvertTo-Json -Compress
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText(
            (Join-Path $releaseInput 'provenance.json'),
            $json,
            $utf8NoBom
          )

      - name: Upload aligned APK for protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-reader-v2-release-input-${{ github.sha }}
          path: native-spread-module/build/release-input/*
          if-no-files-found: error
          retention-days: 1

  native-spread-upgrade-artifact:
    name: Native Reader v2 stable-signer artifact
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner)
    needs:
      - native-spread-build
      - build
    runs-on: windows-latest
    timeout-minutes: 45
    # SECURITY: NATIVE_SPREAD_KEYSTORE_B64 must exist only as an environment
    # secret in virtual-spread-release, never as a repository-scoped secret.
    environment: virtual-spread-release

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Download tested aligned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-reader-v2-release-input-${{ github.sha }}
          path: release-input

      - name: Verify aligned APK provenance without signing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inputApk = Join-Path $env:GITHUB_WORKSPACE `
            'release-input\SupernoteNativeReaderV2-v0.0.140-aligned.apk'
          $provenancePath = Join-Path $env:GITHUB_WORKSPACE `
            'release-input\provenance.json'
          foreach ($path in @($inputApk, $provenancePath)) {
            $item = Get-Item -LiteralPath $path -Force
            if (-not $item.PSIsContainer -and
                -not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              continue
            }
            throw "Release input is not an ordinary file: $path"
          }
          $releaseFiles = @(Get-ChildItem `
            -LiteralPath (Split-Path $inputApk) `
            -Force)
          if ($releaseFiles.Count -ne 2) {
            throw 'Release input contains unexpected files.'
          }
          $provenance = Get-Content `
            -LiteralPath $provenancePath `
            -Raw | ConvertFrom-Json
          [string[]]$actualFields = @($provenance.PSObject.Properties.Name)
          [string[]]$expectedFields = @(
            'schemaVersion',
            'authority',
            'sourceCommit',
            'artifactFile',
            'artifactSha256',
            'packageName',
            'versionCode',
            'versionName',
            'expectedSignerSha256'
          )
          [Array]::Sort($actualFields, [StringComparer]::Ordinal)
          [Array]::Sort($expectedFields, [StringComparer]::Ordinal)
          if ([string]::Join("`n", $actualFields) -cne
              [string]::Join("`n", $expectedFields)) {
            throw 'Release provenance has an unexpected schema.'
          }
          if ($provenance.schemaVersion -cne 1 -or
              $provenance.authority -cne 'supernote-native-reader-v2-release-input-v1' -or
              $provenance.sourceCommit -cne '${{ github.sha }}' -or
              $provenance.artifactFile -cne 'SupernoteNativeReaderV2-v0.0.140-aligned.apk' -or
              $provenance.packageName -cne 'com.techrebbe.supernote.spreadprobe' -or
              $provenance.versionCode -cne 140 -or
              $provenance.versionName -cne '0.0.140' -or
              $provenance.expectedSignerSha256 -cne 'a5a8551131de84d41660a3cf22d224f320f7a2f05a380282f76f6fe731807c67') {
            throw 'Release provenance does not match the reviewed release authority.'
          }
          $actualSha256 = (Get-FileHash `
            -LiteralPath $inputApk `
            -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($provenance.artifactSha256 -cne $actualSha256) {
            throw 'Aligned APK digest does not match its provenance.'
          }
          $buildTools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0'
          $zipalign = Join-Path $buildTools 'zipalign.exe'
          $aapt2 = Join-Path $buildTools 'aapt2.exe'
          $apksigner = Join-Path $buildTools 'apksigner.bat'
          & $zipalign -c -p 4 $inputApk
          if ($LASTEXITCODE -ne 0) {
            throw 'Release input APK is not correctly aligned.'
          }
          $badging = @(& $aapt2 dump badging $inputApk 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the release input APK manifest.'
          }
          $packageLine = @($badging | Where-Object { $_ -like 'package:*' })
          if ($packageLine.Count -ne 1 -or
              $packageLine[0] -cnotmatch "^package: name='com\.techrebbe\.supernote\.spreadprobe' versionCode='140' versionName='0\.0\.140'") {
            throw 'Release input APK package/version authority does not match.'
          }
          & $apksigner verify $inputApk 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release input APK is unexpectedly already signed.'
          }

      - name: Sign, verify, and remove protected Native Reader signing key
        shell: powershell
        env:
          NATIVE_SPREAD_KEYSTORE_B64: ${{ secrets.NATIVE_SPREAD_KEYSTORE_B64 }}
          EXPECTED_SIGNER_SHA256: a5a8551131de84d41660a3cf22d224f320f7a2f05a380282f76f6fe731807c67
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NATIVE_SPREAD_KEYSTORE_B64)) {
            throw 'The protected Native Reader signing key is unavailable.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP (
            'native-reader-v2-' + [Guid]::NewGuid().ToString('N') + '.keystore'
          )
          $keyBytes = $null
          try {
            $keyBytes = [Convert]::FromBase64String(
              $env:NATIVE_SPREAD_KEYSTORE_B64
            )
            $env:NATIVE_SPREAD_KEYSTORE_B64 = $null
            [IO.File]::WriteAllBytes($keystore, $keyBytes)
            [Array]::Clear($keyBytes, 0, $keyBytes.Length)
            $keyBytes = $null
            $buildTools = Join-Path $env:ANDROID_SDK_ROOT `
              'build-tools\35.0.0'
            $apksigner = Join-Path $buildTools 'apksigner.bat'
            $inputApk = Join-Path $env:GITHUB_WORKSPACE `
              'release-input\SupernoteNativeReaderV2-v0.0.140-aligned.apk'
            $outputDir = Join-Path $env:GITHUB_WORKSPACE 'release-output'
            $outputApk = Join-Path $outputDir `
              'SupernoteNativeSpreadProbe-v0.0.140.apk'
            New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
            & $apksigner sign `
              --ks $keystore `
              --ks-key-alias androiddebugkey `
              --ks-pass pass:android `
              --key-pass pass:android `
              --out $outputApk `
              $inputApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner failed with exit code $LASTEXITCODE"
            }
            $verification = @(
              & $apksigner verify --verbose --print-certs $outputApk 2>&1
            )
            $verificationExitCode = $LASTEXITCODE
            $verification | ForEach-Object { Write-Host $_ }
            if ($verificationExitCode -ne 0) {
              throw "apksigner verification failed with exit code $verificationExitCode"
            }
            $signerMatches = @(
              $verification | Select-String -Pattern `
                '^Signer #[0-9]+ certificate SHA-256 digest: ([0-9A-Fa-f:]+)$'
            )
            if ($signerMatches.Count -ne 1) {
              throw 'Expected exactly one APK signer certificate.'
            }
            $actualSigner = $signerMatches[0].Matches[0].Groups[1].Value.Replace(':', '')
            if (-not $actualSigner.Equals(
                $env:EXPECTED_SIGNER_SHA256,
                [StringComparison]::OrdinalIgnoreCase
            )) {
              throw 'APK signer does not match the reviewed upgrade identity.'
            }
            if (-not ($verification -contains 'Verified using v2 scheme (APK Signature Scheme v2): true') -or
                -not ($verification -contains 'Verified using v3 scheme (APK Signature Scheme v3): true')) {
              throw 'Signed APK is missing required modern signature schemes.'
            }
            $expectedSignedLength = 291355L
            $expectedSignedSha256 = `
              '848c05a4697c600278159c97442b81ecb7241134e993e115509ee0d797b43984'
            $actualSignedLength = (Get-Item `
              -LiteralPath $outputApk `
              -Force
            ).Length
            if ($actualSignedLength -ne $expectedSignedLength) {
              throw "Signed APK length differs from the reviewed upgrade identity: $actualSignedLength"
            }
            $actualSignedSha256 = (Get-FileHash `
              -LiteralPath $outputApk `
              -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($actualSignedSha256 -cne $expectedSignedSha256) {
              throw 'Signed APK SHA-256 differs from the reviewed upgrade identity.'
            }
          } finally {
            $env:NATIVE_SPREAD_KEYSTORE_B64 = $null
            if ($null -ne $keyBytes) {
              [Array]::Clear($keyBytes, 0, $keyBytes.Length)
            }
            if (Test-Path -LiteralPath $keystore) {
              Remove-Item -LiteralPath $keystore -Force
            }
          }

      - name: Upload upgrade-compatible Native Reader APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supernote-native-reader-v2-v0.0.140
          path: release-output/SupernoteNativeSpreadProbe-v0.0.140.apk
          if-no-files-found: error
          retention-days: 7

  virtual-spread-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: virtual_spread/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare ephemeral companion signing key
        id: companion-signing
        shell: bash
        run: |
          ephemeral_path="$RUNNER_TEMP/virtual-spread-ephemeral.keystore"
          keytool -genkeypair \
            -keystore "$ephemeral_path" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Virtual Spread CI,O=techrebbe,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2
          cert_path="$RUNNER_TEMP/virtual-spread-ephemeral.der"
          keytool -exportcert \
            -keystore "$ephemeral_path" \
            -storepass android \
            -alias androiddebugkey \
            -file "$cert_path"
          fingerprint="$(sha256sum "$cert_path" | cut -d' ' -f1)"
          rm -f "$cert_path"
          test "${#fingerprint}" -eq 64
          echo "keystore=$ephemeral_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Install pinned virtual-spread dependencies
        run: python -m pip install -r virtual_spread/requirements.txt

      - name: Test virtual-spread generator
        run: python scripts/test_virtual_spread.py

      - name: Test mapping wire contract
        run: python scripts/test_mapping_contract.py

      - name: Test navigation wire contract
        run: python scripts/test_navigation_contract.py

      - name: Verify page-143 cross-project artifacts
        run: python scripts/test_page_143_artifacts.py

      - name: Check native invariants
        run: |
          python scripts/check_native_invariants.py .

      - name: Test virtual-spread companion module
        shell: pwsh
        run: ./virtual-spread-module/test.ps1

      - name: Build and verify virtual-spread companion APK
        shell: pwsh
        env:
          VIRTUAL_SPREAD_KEYSTORE: ${{ steps.companion-signing.outputs.keystore }}
          EXPECTED_SIGNER_SHA256: ${{ steps.companion-signing.outputs.sha256 }}
        run: >-
          ./virtual-spread-module/build.ps1
          -DebugKeystore $env:VIRTUAL_SPREAD_KEYSTORE
          -ExpectedSignerSha256 $env:EXPECTED_SIGNER_SHA256

      - name: Reject mismatched virtual-spread companion signer
        shell: pwsh
        env:
          VIRTUAL_SPREAD_KEYSTORE: ${{ steps.companion-signing.outputs.keystore }}
        run: |
          try {
            ./virtual-spread-module/build.ps1 `
              -DebugKeystore $env:VIRTUAL_SPREAD_KEYSTORE `
              -ExpectedSignerSha256 ('0' * 64)
            throw 'Mismatched APK signer was accepted'
          } catch {
            if ($_.Exception.Message -notmatch `
                'certificate does not match the expected release signer') {
              throw
            }
          }


  virtual-spread-release-assembly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: virtual-spread-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted main for clean assembly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Assemble aligned APK without Python or signing credentials
        shell: pwsh
        run: >-
          ./virtual-spread-module/build.ps1
          -SkipTests
          -AlignedOnly

      - name: Prepare clean aligned APK evidence
        shell: bash
        run: |
          set -euo pipefail
          input_dir='virtual-spread-module/build/release-input'
          rm -rf "$input_dir"
          mkdir -p "$input_dir"
          install -m 0644 \
            virtual-spread-module/build/virtual-spread-aligned.apk \
            "$input_dir/virtual-spread-aligned.apk"
          cd "$input_dir"
          sha256sum virtual-spread-aligned.apk \
            > virtual-spread-aligned.apk.sha256

      - name: Upload clean aligned APK for protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virtual-spread-release-input-${{ github.sha }}
          path: virtual-spread-module/build/release-input/*
          if-no-files-found: error
          retention-days: 1


  virtual-spread-release-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: virtual-spread-release-assembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: virtual-spread-release

    steps:
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download tested aligned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: virtual-spread-release-input-${{ github.sha }}
          path: release-input

      - name: Verify tested aligned APK digest
        shell: bash
        run: |
          set -euo pipefail
          test -f release-input/virtual-spread-aligned.apk
          test ! -L release-input/virtual-spread-aligned.apk
          test -f release-input/virtual-spread-aligned.apk.sha256
          test ! -L release-input/virtual-spread-aligned.apk.sha256
          cd release-input
          sha256sum --check --strict virtual-spread-aligned.apk.sha256

      - name: Sign, verify, and remove protected signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.VIRTUAL_SPREAD_APK_KEYSTORE_BASE64 }}
          EXPECTED_SIGNER_SHA256: a5a8551131de84d41660a3cf22d224f320f7a2f05a380282f76f6fe731807c67
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "Protected signing key is unavailable"
          }
          $stablePath = Join-Path $env:RUNNER_TEMP (
            'virtual-spread-' + [Guid]::NewGuid().ToString('N') + '.keystore'
          )
          $bytes = $null
          try {
            $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
            $env:KEYSTORE_BASE64 = $null
            [IO.File]::WriteAllBytes($stablePath, $bytes)
            [Array]::Clear($bytes, 0, $bytes.Length)
            $bytes = $null
            $apksigner = Join-Path $env:ANDROID_SDK_ROOT `
              'build-tools/35.0.0/apksigner'
            $inputApk = Join-Path $env:GITHUB_WORKSPACE `
              'release-input/virtual-spread-aligned.apk'
            $outputDir = Join-Path $env:GITHUB_WORKSPACE 'release-output'
            $outputApk = Join-Path $outputDir `
              'SupernoteVirtualSpreadNavigation.apk'
            New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
            & $apksigner sign `
              --ks $stablePath `
              --ks-key-alias androiddebugkey `
              --ks-pass pass:android `
              --key-pass pass:android `
              --out $outputApk `
              $inputApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner failed with exit code $LASTEXITCODE"
            }
            $verification = @(
              & $apksigner verify --verbose --print-certs $outputApk 2>&1
            )
            $verificationExitCode = $LASTEXITCODE
            $verification | ForEach-Object { Write-Host $_ }
            if ($verificationExitCode -ne 0) {
              throw "apksigner verification failed with exit code " +
                $verificationExitCode
            }
            $signerMatches = @(
              $verification |
                Select-String -Pattern `
                  '^Signer #[0-9]+ certificate SHA-256 digest: ([0-9A-Fa-f:]+)$'
            )
            if ($signerMatches.Count -ne 1) {
              throw "Expected exactly one APK signer certificate"
            }
            $actualSignerSha256 = $signerMatches[0].Matches[0].Groups[1].Value.Replace(':', '')
            if (-not $actualSignerSha256.Equals(
                $env:EXPECTED_SIGNER_SHA256,
                [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "APK signer certificate does not match the expected release signer"
            }
          } finally {
            $env:KEYSTORE_BASE64 = $null
            if ($null -ne $bytes) {
              [Array]::Clear($bytes, 0, $bytes.Length)
            }
            if (Test-Path -LiteralPath $stablePath) {
              Remove-Item -LiteralPath $stablePath -Force
            }
          }

      - name: Upload upgrade-compatible companion APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supernote-virtual-spread-navigation
          path: release-output/*.apk
          if-no-files-found: error
          retention-days: 3

  build:
    needs:
      - native-spread-build
      - virtual-spread-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build plugin
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.2
          chmod +x build.sh
          set +e
          ./build.sh > build.log 2>&1
          status=$?
          tail -n 100 build.log > build-tail.log
          cat build-tail.log
          exit $status

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supernote-rtl-reader-build-failure
          path: build-tail.log
          if-no-files-found: error
          retention-days: 2

      - name: Verify package
        run: |
          mapfile -t packages < <(find out -maxdepth 1 -type f -name '*.snplg' -print)
          test "${#packages[@]}" -eq 1
          python3 scripts/verify_plugin_package.py \
            "${packages[0]}" \
            . \
            out/build-provenance/SupernoteRtlReader.bundle \
            out/build-provenance/app.npk
          ls -lh "${packages[0]}"

      - name: Upload plugin package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supernote-rtl-reader-v0.4.22-native-reader-v2
          path: out/*.snplg
          if-no-files-found: error
          retention-days: 3
