name: Build Supernote RTL Reader

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supernote-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace-helper-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Native Spread trace-helper tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_trace_helper_fail_closed.ps1

  invariant-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run full invariant suites
        run: |
          python3 scripts/test_native_reader_v2_core.py .
          python3 scripts/test_native_reader_v2_mutations.py .
          python3 scripts/check_native_reader_v2_invariants.py .
          python3 scripts/check_native_invariants.py .
          python3 scripts/test_plugin_packaging_fail_closed.py

  native-spread-build:
    name: Native Spread compile and verification only
    needs:
      - invariant-suites
      - trace-helper-tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Compile and verify Native Spread companion package
        shell: powershell
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) {
            $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
            $env:ANDROID_HOME
          } else {
            throw 'Android SDK setup did not publish an SDK root.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'native-spread-debug.keystore'
          # build.ps1 verifies a fully packaged APK, which requires signing.
          # This disposable runner-local identity is never published and is
          # not an upgrade-compatible release identity.
          & keytool -genkeypair -noprompt `
            -keystore $keystore `
            -storetype JKS `
            -storepass android `
            -alias androiddebugkey `
            -keypass android `
            -dname 'CN=Android Debug,O=Android,C=US' `
            -keyalg RSA `
            -keysize 2048 `
            -validity 10000
          if ($LASTEXITCODE -ne 0) {
            throw "Debug-keystore creation failed with exit code $LASTEXITCODE"
          }
          $signerLine = (& keytool -list -v `
            -keystore $keystore `
            -storepass android `
            -alias androiddebugkey | Select-String 'SHA256:').Line
          $runnerSigner = ($signerLine -split 'SHA256:', 2)[1].Trim().Replace(':', '').ToLowerInvariant()
          $windowsPowerShell = Join-Path `
            $env:SystemRoot `
            'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\native-spread-module\build.ps1 `
            -AndroidSdk $sdk `
            -DebugKeystore $keystore `
            -ExpectedSignerSha256 $runnerSigner
          if ($LASTEXITCODE -ne 0) {
            throw "Native Spread build failed with exit code $LASTEXITCODE"
          }
          Write-Host (
            'Native package compiled and verified with a disposable ' +
            'runner-local identity; no APK is published by this workflow.'
          )

  native-spread-upgrade-artifact:
    name: Native Reader v2 stable-signer artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - native-spread-build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Restore stable Native Reader signing identity
        shell: powershell
        env:
          NATIVE_SPREAD_KEYSTORE_B64: ${{ secrets.NATIVE_SPREAD_KEYSTORE_B64 }}
        run: |
          if (-not $env:NATIVE_SPREAD_KEYSTORE_B64) {
            throw 'The stable Native Reader signing secret is unavailable.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'native-spread-stable.keystore'
          [System.IO.File]::WriteAllBytes(
            $keystore,
            [Convert]::FromBase64String($env:NATIVE_SPREAD_KEYSTORE_B64)
          )
          "NATIVE_SPREAD_KEYSTORE=$keystore" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build and verify upgrade-compatible Native Reader APK
        shell: powershell
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) {
            $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
            $env:ANDROID_HOME
          } else {
            throw 'Android SDK setup did not publish an SDK root.'
          }
          $windowsPowerShell = Join-Path `
            $env:SystemRoot `
            'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\native-spread-module\build.ps1 `
            -AndroidSdk $sdk `
            -DebugKeystore $env:NATIVE_SPREAD_KEYSTORE `
            -ExpectedSignerSha256 a5a8551131de84d41660a3cf22d224f320f7a2f05a380282f76f6fe731807c67
          if ($LASTEXITCODE -ne 0) {
            throw "Stable Native Reader build failed with exit code $LASTEXITCODE"
          }

      - name: Upload upgrade-compatible Native Reader APK
        uses: actions/upload-artifact@v4
        with:
          name: supernote-native-reader-v2-v0.0.137
          path: native-spread-module/build/artifact/*.apk
          if-no-files-found: error
          retention-days: 7

  build:
    needs:
      - native-spread-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build plugin
        run: |
          chmod +x build.sh
          set +e
          ./build.sh > build.log 2>&1
          status=$?
          tail -n 100 build.log > build-tail.log
          cat build-tail.log
          exit $status

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-build-failure
          path: build-tail.log
          if-no-files-found: error
          retention-days: 2

      - name: Verify package
        run: |
          mapfile -t packages < <(find out -maxdepth 1 -type f -name '*.snplg' -print)
          test "${#packages[@]}" -eq 1
          python3 scripts/verify_plugin_package.py "${packages[0]}" .
          ls -lh "${packages[0]}"

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-v0.4.16-native-reader-v2
          path: out/*.snplg
          if-no-files-found: error
          retention-days: 3
