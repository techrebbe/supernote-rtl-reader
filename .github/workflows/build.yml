name: Build Supernote RTL Reader

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supernote-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build plugin
        run: |
          chmod +x build.sh
          set +e
          ./build.sh > build.log 2>&1
          status=$?
          tail -n 100 build.log > build-tail.log
          cat build-tail.log
          exit $status

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-build-failure
          path: build-tail.log
          if-no-files-found: error
          retention-days: 2

      - name: Verify package
        run: |
          test -n "$(find out -maxdepth 1 -name '*.snplg' -print -quit)"
          ls -lh out/*.snplg

      - name: Upload plugin package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: supernote-rtl-reader-v0.4.8-protected-editable-pilot
          path: out/*.snplg
          if-no-files-found: error
          retention-days: 3
