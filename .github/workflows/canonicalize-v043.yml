name: Canonicalize v0.4.3 native source

on:
  push:
    branches:
      - v0.4.3

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ hashFiles('scripts/install_native_v042.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout v0.4.3
        uses: actions/checkout@v4
        with:
          ref: v0.4.3
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate tested v0.4.2 native source
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT="$(mktemp -d)"
          trap 'rm -rf "$WORK_ROOT"' EXIT

          pushd "$WORK_ROOT" >/dev/null
          npx --yes @react-native-community/cli@18.0.0 init SupernoteRtlReader \
            --template @supernote-plugin/sn-plugin-template \
            --version 0.79.2
          popd >/dev/null

          PROJECT="$WORK_ROOT/SupernoteRtlReader"
          cp overlay/App.js "$PROJECT/App.js"
          cp overlay/index.js "$PROJECT/index.js"
          cp overlay/app.json "$PROJECT/app.json"
          cp PluginConfig.json "$PROJECT/PluginConfig.json"

          python3 - "$PROJECT/App.js" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "<View style={styles.footer}>"
          new = "<View style={[styles.footer, {direction: 'ltr'}]}>"
          if text.count(old) != 1:
              raise SystemExit("Footer layout marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python3 scripts/patch_direct_view.py "$PROJECT/App.js"
          python3 scripts/install_native_v042.py "$PROJECT" "$GITHUB_WORKSPACE"
          python3 scripts/canonicalize_v043.py "$PROJECT" "$GITHUB_WORKSPACE"

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize the v0.4.2 native renderer for v0.4.3"
          git push origin HEAD:v0.4.3
